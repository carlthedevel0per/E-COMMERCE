<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> CHECKOUT </title>
  <link rel="icon" href="Photos/CSHOP.jpg">
  <link rel="stylesheet" href="styles/checkout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amarante&family=Chewy&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="checkout-header">
    <div class="checkout-header-left-section">
      <a href="products.html" class="header-link">
        <img src="Photos/CSHOP.jpg" class="shop-icon">
      </a>
    </div>

    <div class="checkout-header-middle-section">
      <h1>
        CHECKOUT (2) Items
      </h1>
    </div>

    <div class="checkout-header-right-section">
      <a href="orders.html" class="header-link">
        <img src="Photos/package-icon.jpg" class="orders-icon">
      </a>
    </div>

  </div>

  <h1 class="orders-header"> YOUR ORDERS </h1>

  <div class="checkout-container">

    <div class="order-section js-order-section">
    </div>

    <div class="checkout-second-section">

      <div class="delivery-option-section">

        <h1> Choose a delivery option: </h1>

        <div class="delivery-options">
          <input type="radio" name="option" id="option1">
          <label for="option1"> Monday, July 27 </label>
          <p> +$7.99 </p>
        </div>

        <div class="delivery-options">
          <input type="radio" name="option" id="option2">
          <label for="option2"> Wednesday, July 29 </label>
          <p> +$2.99 </p>
        </div>

        <div class="delivery-options">
          <input type="radio" name="option" id="option3">
          <label for="option3"> Friday, July 31 </label>
          <p> FREE SHIPPING </p>
        </div>

      </div>

      <div class="order-summary-section js-order-summary">

        <h1> Order Summary </h1>

      
      </div>

    </div>
    
  </div>

  <script type="module" src="scripts/checkout.js"></script>

  
</body>
</html>
