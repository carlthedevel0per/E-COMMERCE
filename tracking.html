<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> TRACKING </title>
  <link rel="icon" href="Photos/CSHOP.jpg">
  <link rel="stylesheet" href="styles/tracking.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amarante&family=Chewy&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

  <div class="tracking-header">

    <div class="tracking-header-left-side">
      <a href="products.html" class="header-link">
        <img src="Photos/CSHOP-WHITE.jpg" class="cshop-logo">
      </a>
    </div>

    <div class="tracking-header-middle-side">
      <input type="text" class="search-bar" placeholder="Search">
      <button class="search-button"> 
        <img src="Photos/search-icon.png" class="search-icon">
      </button>
  
    </div>

    <div class="tracking-header-right-side">
      <a href="orders.html" class="header-link orders-link">
        <span class="returns-text"> Returns </span>
        <span class="orders-text"> & Orders </span>
      </a>

      <a href="checkout.html" class="cart-link header-link">
        <img src="Photos/cart-icon.png" class="cart-icon">
        <span class="cart-quantity"> 0 </span>
      </a>
    </div>

  </div>

  <a href="orders.html" class="back-to-orders-header">
    <h1> VIEW ALL ORDERS </h1>
  </a>

    <div class="package-details">
      <span class="arrival-date"> Arriving on Monday, August 5 </span>

      <div class="package-grid-container">

          <div class="each-package-details">
            <img src="Photos/pistol.png" class="product-image">

            <div class="specific-details">
              <p class="product-name"> Pistol </p>
              <p class="product-quantity"> Quantity: 1 </p>
            </div>

          </div>

          <div class="each-package-details">
            <img src="Photos/sniper.png" class="product-image">

            <div class="specific-details">
              <p class="product-name"> Sniper </p>
              <p class="product-quantity"> Quantity: 1 </p>
            </div>  
            
          </div>

      </div>
      
    </div>


  
</body>
</html>
