<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> ORDERS </title>
  <link rel="icon" href="Photos/CSHOP.jpg">
  <link rel="stylesheet" href="styles/orders.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amarante&family=Chewy&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

  <div class="orders-header">

    <div class="orders-header-left-section">
      <a href="products.html" class="header-link">
        <img src="Photos/CSHOP-WHITE.jpg" class="cshop-logo">
      </a>
    </div>

    <div class="orders-header-middle-section">
      <input type="text" placeholder="Search" class="search-bar">
      <button class="search-button"> 
        <img src="Photos/search-icon.png" class="search-icon">
      </button>
  
    </div>

    <div class="orders-header-right-section">

      <a href="orders.html" class="orders-link header-link">
        <span class="returns-text"> Returns </span>
        <span class="orders-text"> & Orders </span>
      </a>
      
      <a href="checkout.html" class="cart-link header-link">
        <img src="Photos/cart-icon.png" class="cart-icon">
        <span class="cart-quantity"> 0 </span>
      </a>
      
    </div>

  </div>

  <h1 class="order-header"> YOUR ORDERS </h1>

  <div class="orders-section">

    <div class="order-details-container">

      <div class="order-specific-info">

        <div class="order-place">
            <p> 
              <b> Order Placed: </b> 
              July 29 
            </p>
        </div>

        <div class="order-total">
            <p> 
              <b> Total: </b> 
              $5,501.21 
            </p>
          
        </div>

        <div class="order-id">
          
            <p> 
              <b> Order ID: </b> abcedh02134casdsa 
            </p>
          
        </div>

        <div class="order-arriving-time">
            <p> 
              <b> Arriving on: </b>
               August 5 
            </p>
        </div>

      </div>


      <div class="track-package">
        <a href="tracking.html"> Track Package </a>
      </div>

      <div class="order-product-details">

        <div class="each-order-product">
          <img src="Photos/pistol.png" 
          class="order-image">
            <div class="each-order-product-details">
              <p class="product-name"> PISTOL </p>
              <p class="product-quantity"> <b> Quantity: </b> 1</p>
            </div>
        </div>

        <div class="each-order-product">
          <img src="Photos/sniper.png" class="order-image">
            <div class="each-order-product-details">
              <p class="product-name"> SNIPER </p>
              <p> <b> Quantity: </b> 1 </p>
            </div>
        </div>

      </div>


    </div>

  </div>
  
<body>
  
</body>
</html>
