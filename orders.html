<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> ORDERS </title>
  <link rel="icon" href="Photos/CSHOP.jpg">
  <link rel="stylesheet" href="styles/orders.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amarante&family=Chewy&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

  <div class="orders-header">

    <div class="orders-header-left-section">
      <a href="products.html" class="header-link">
        <img src="Photos/CSHOP-WHITE.jpg" class="cshop-logo">
      </a>
    </div>

    <div class="orders-header-middle-section">
      <input type="text" placeholder="Search" class="search-bar js-input-box">
      <button class="search-button js-search-button"> 
        <img src="Photos/search-icon.png" class="search-icon">
      </button>
  
    </div>

    <div class="orders-header-right-section">

      <a href="orders.html" class="orders-link header-link">
        <span class="returns-text"> Returns </span>
        <span class="orders-text"> & Orders </span>
      </a>
      
      <a href="checkout.html" class="cart-link header-link">
        <img src="Photos/cart-icon.png" class="cart-icon">
        <span class="cart-quantity js-cart-quantity"> 0 </span>
      </a>
      
    </div>

  </div>

  <h1 class="order-header"> YOUR ORDERS </h1>

  <div class="orders-section js-orders-section">

  </div>
  
  <script type="module"src="scripts/orders.js"> </script>

</body>
</html>
